server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:data/company.db
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLiteDialect

  flyway:
    enabled: false

app:
  jwt:
    secret: windown-super-secret-key-for-jwt-signing-2024-must-be-at-least-256-bits
    expiration-ms: 86400000   # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

logging:
  level:
    com.windown: DEBUG
    org.springframework.security: INFO

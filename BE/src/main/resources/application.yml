server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3308/windown_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: windown-super-secret-key-for-jwt-signing-2024-must-be-at-least-256-bits
    expiration-ms: 86400000   # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

logging:
  level:
    com.windown: DEBUG
    org.springframework.security: INFO
